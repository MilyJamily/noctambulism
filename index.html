<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noctambulism</title>
    <link rel="stylesheet" href="style.css">
    <!-- Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
                "three/examples/jsm/loaders/GLTFLoader.js": "https://unpkg.com/three@0.152.2/examples/jsm/loaders/GLTFLoader.js"
            }
        }
    </script>
</head>
<body>

    <!-- Grain effect -->
    <div class="grain-overlay"></div>

    <div id="game-container">
        <!-- Grain effect -->
        <div class="grain-overlay"></div>

        <!-- Sketch & Tunnel Vision -->
        <div class="sketch-vignette"></div>
        <div class="sketch-overlay"></div>

        <!-- Terminal prompt for door interaction -->
        <div id="interaction-prompt" class="hidden">[ PRESS 'E' TO OPEN ]</div>
        <div id="hint-prompt" class="hint-text hidden">[ Look back ]</div>

        <!-- Cell pop-up Window -->
        <div id="cell-modal" class="hidden">
            <div class="cell-modal-frame">
                <div class="cell-header">
                    <span class="cell-title">LOG_VIEWER // CELL_INSPECTION</span>
                    <span class="cell-close-hint">[ PRESS 'SPACE' TO EXIT ]</span>
                </div>
                <div id="cell-canvas-container"></div>
                <div id="cell-dialogue-box">
                    <span id="cell-text"></span>
                </div>
            </div>
        </div>
        
        <!-- Fade Overlay Transitions -->
        <div id="fade-overlay"></div>

        <!-- Real World Glitch Effect -->
        <div id="real-glitch-overlay"></div>

        <!-- Title Screen -->
        <div id="title-screen" class="screen">
            <h1 class="game-title">NOCTAMBULISM</h1>
            <p class="subtitle">- Based on a true story -</p>
            <button id="start-btn">SLEEP</button>
        </div>

        <!-- Act 1: Bedroom POV -->
        <div id="bedroom-scene" class="screen hidden"></div>

        <!-- Act 2: The Dream / Endless Hallway -->
        <div id="arcade-scene" class="screen hidden"></div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
